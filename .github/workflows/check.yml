name: Check

# Runs every fast check on each pull request and each push to master, the gate the pre-commit hook can't be.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dev tools
        run: npm ci

      # make check validates the plugins with the Claude Code CLI; validation needs no credentials.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.309

      - name: Run make check
        run: make check
