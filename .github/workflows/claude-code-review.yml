name: Claude Code Review

on:
  # Runs when a PR opens, and on demand when a PR comment is "@review" or starts with "@review" and a space or line break.
  # "@claude" stays bound to the general assistant in claude.yml.
  # docs/FORGE.md declares this trigger; change one, change both.
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (github.event.comment.body == '@review' || startsWith(github.event.comment.body, '@review ') || startsWith(github.event.comment.body, format('@review{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('@review{0}', fromJSON('"\r"'))))) ||
      (github.event_name == 'pull_request_review_comment' && (github.event.comment.body == '@review' || startsWith(github.event.comment.body, '@review ') || startsWith(github.event.comment.body, format('@review{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('@review{0}', fromJSON('"\r"')))))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        env:
          # The review fans out to subagents that can outlast a headless session's 10-minute wait for background work.
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          # Tag mode posts the progress comment that docs/FORGE.md's review status reads. It passes the prompt as
          # instructions rather than as a slash command, so the prompt asks for the command through the Skill tool.
          track_progress: true
          show_full_output: true
          prompt: "Run the `code-review:code-review` command with the Skill tool, with the arguments `--comment ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}`."
          # The action sets up the inline-comment tool only when it is allowed here.
          claude_args: >-
            --model claude-opus-5-5 --effort xhigh
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
