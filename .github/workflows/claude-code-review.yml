name: Claude Code Review

on:
  # Runs when a PR opens, and on demand when a PR comment mentions "@review".
  # "@claude" stays bound to the general assistant in claude.yml.
  # docs/FORGE.md declares this trigger; change one, change both.
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@review')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@review'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # Tag mode gives the review agents the GitHub commenting tools.
          track_progress: true
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}"
          claude_args: "--model claude-opus-5-5 --effort xhigh"
