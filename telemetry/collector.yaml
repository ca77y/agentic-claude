# Receives Claude Code's OpenTelemetry export on localhost and writes it to local JSON-lines files,
# one per signal, which the sync job uploads to the telemetry bucket.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch: {}

exporters:
  file/logs:
    path: ${env:HOME}/.claude/otel/logs.jsonl
    format: json
    flush_interval: 5s
    rotation:
      max_megabytes: 50
      max_backups: 1000
      localtime: true
  file/metrics:
    path: ${env:HOME}/.claude/otel/metrics.jsonl
    format: json
    flush_interval: 5s
    rotation:
      max_megabytes: 50
      max_backups: 1000
      localtime: true

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics]
